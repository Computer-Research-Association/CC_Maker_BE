name: Deploy Spring Boot to EC2 via SCP + Docker

on:
  push:
    branches:
      - test-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Give execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot application
        run: ./gradlew clean bootJar -x test

      - name: Prepare PEM key
        run: |
          echo "${{ secrets.PEM_KEY }}" > my-key.pem
          chmod 600 my-key.pem

      - name: Copy JAR to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i my-key.pem build/libs/*.jar \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.DEPLOY_DIR }}/app.jar

      - name: Deploy Dockerized app on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i my-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "🛠 Docker 재배포 시작"

            cd ${{ secrets.DEPLOY_DIR }}

            # 기존 컨테이너 종료 및 제거
            docker stop spring-app || true
            docker rm spring-app || true

            # 새 Docker 이미지 빌드
            docker build -t spring-app .

            # 컨테이너 실행
            docker run -d --name spring-app -p 8080:8080 spring-app

            echo "✅ Docker 배포 완료"
          EOF
