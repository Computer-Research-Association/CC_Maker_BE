name: Deploy Spring Boot to EC2 via SCP + Docker Compose

on:
  push:
    branches:
      - test-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Give execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot application
        run: ./gradlew clean bootJar -x test

      - name: Rename JAR for deployment
        run: |
          JAR_PATH=$(ls build/libs/*.jar | head -n 1)
          cp "$JAR_PATH" build/libs/app.jar

      - name: Prepare PEM key
        run: |
          echo "${{ secrets.PEM_KEY }}" > my-key.pem
          chmod 600 my-key.pem

      - name: Ensure remote deploy directory exists
        run: |
          ssh -o StrictHostKeyChecking=no -i my-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p cc_go"

      - name: Copy necessary files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i my-key.pem build/libs/app.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:cc_go/app.jar

          scp -o StrictHostKeyChecking=no -i my-key.pem Dockerfile \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:cc_go/Dockerfile

          scp -o StrictHostKeyChecking=no -i my-key.pem docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:cc_go/docker-compose.yml

      - name: Deploy using Docker Compose on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i my-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "🛠 Docker Compose 재배포 시작"
            cd cc_go

            docker-compose down || true
            docker-compose up -d --build

            echo "✅ Docker Compose 배포 완료"
          EOF
