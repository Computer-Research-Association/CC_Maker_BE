version: '3.8'

services:
  app:
    build: .
    image: ccgo-app:latest
    container_name: ccgo-app
    ports:
      - "8080:8080"
    restart: always
    env_file:
      - .env
    depends_on:
      - mysql
    environment:
      TZ: Asia/Seoul

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ccmake
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
